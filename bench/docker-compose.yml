services:
  # QWER-Q - same conditions as competitors
  qwerq:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9876:9876"
      - "9877:9877"
    volumes:
      - qwerq-data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9877/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"  # monitoring
    command: ["--jetstream", "-m", "8222"]  # enable JetStream for persistence
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Kafka - the state of the art, needs Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Pulsar - high throughput, tiered storage
  pulsar:
    image: apachepulsar/pulsar:3.1.0
    ports:
      - "6650:6650"   # binary protocol
      - "8081:8080"   # HTTP admin (8080 used by cadvisor)
    command: ["bin/pulsar", "standalone"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # RedPanda - Kafka-compatible, zero data loss focus
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    ports:
      - "9093:9093"   # Kafka API (9092 used by Kafka)
      - "8082:8082"   # HTTP Proxy
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --kafka-addr=0.0.0.0:9093
      - --advertise-kafka-addr=localhost:9093
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Monitoring stack for resource tracking
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

volumes:
  qwerq-data:
