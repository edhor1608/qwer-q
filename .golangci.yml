run:
  timeout: 5m
  tests: false  # Don't lint test files for now

linters:
  enable:
    - gofmt
    - govet
    - staticcheck
    - unused
  disable:
    - errcheck  # Many unchecked errors in existing code, enable later

issues:
  exclude-dirs:
    - bench  # Benchmark code doesn't need strict linting
  exclude-rules:
    - path: internal/protocol/frame.go
      linters:
        - staticcheck
      text: "SA6002"  # sync.Pool with slices is intentional for buffer pooling
