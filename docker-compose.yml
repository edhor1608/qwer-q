version: "3.8"
services:
  qwer-q:
    build: .
    ports:
      - "9876:9876"
      - "9877:9877"
    volumes:
      - qwer-q-data:/data
    command: ["serve"]  # Uses default 100ms sync interval
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
volumes:
  qwer-q-data:
